# Publica o site no GitHub Pages a cada push na branch main
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Definir endereço
        # Sem domínio próprio o site fica em /<nome-do-repositório>; com domínio (arquivo CNAME), na raiz.
        run: |
          if [ -f CNAME ]; then echo "BASE_PATH=" >> $GITHUB_ENV; echo "SITE_URL=https://$(cat CNAME)" >> $GITHUB_ENV;
          else echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV; echo "SITE_URL=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV; fi
      - name: Gerar site
        run: |
          node build.mjs
          [ -f CNAME ] && cp CNAME dist/ || true
      - name: Testar
        run: node tests/check.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
