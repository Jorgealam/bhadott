<!DOCTYPE html>
<html lang="pt-BR" data-section="{{section}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <meta name="robots" content="{{robots}}" />
  <link rel="canonical" href="{{canonical}}" />
  <link rel="alternate" hreflang="pt-BR" href="{{canonical}}" />
  <meta property="og:type" content="{{og_type}}" />
  <meta property="og:site_name" content="BHADOTT" />
  <meta property="og:title" content="{{title}}" />
  <meta property="og:description" content="{{description}}" />
  <meta property="og:url" content="{{canonical}}" />
  <meta property="og:image" content="{{site_url}}/assets/og-image.png" />
  <meta property="og:locale" content="pt_BR" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#020617" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v={{version}}" />
  <script src="/js/theme.js?v={{version}}"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "BHADOTT Studio",
    "alternateName": "BHADOTT",
    "url": "{{site_url}}/",
    "logo": "{{site_url}}/assets/favicon.svg",
    "slogan": "Games · AI · Creative Technology",
    "founder": { "@type": "Person", "name": "Jorge Alam" },
    "areaServed": "BR",
    "sameAs": ["https://github.com/Jorgealam"]
  }
  </script>
</head>
<body>
  <a class="skip" href="#conteudo">Pular para o conteúdo</a>
  {{> loader}}
  <canvas id="sky" aria-hidden="true"></canvas>
  {{> header}}
  <main id="conteudo">
{{content}}
  </main>
  {{> footer}}
  {{> widgets}}
  <script src="/js/config.js?v={{version}}"></script>
  <script src="/js/main.js?v={{version}}" defer></script>
  <script src="/js/sky.js?v={{version}}" defer></script>
  <script src="/js/chat.js?v={{version}}" defer></script>
  {{scripts}}
</body>
</html>
