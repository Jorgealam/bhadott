<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>og-image</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: "Segoe UI", Inter, Arial, sans-serif; color: #f8fafc; position: relative;
    background: radial-gradient(ellipse at 15% 85%, rgba(139,92,246,.45), transparent 55%), radial-gradient(ellipse at 90% 10%, rgba(59,130,246,.35), transparent 50%), #020617; }
  .stars { position: absolute; inset: 0; background-image:
    radial-gradient(1.5px 1.5px at 8% 20%, #fff, transparent), radial-gradient(1px 1px at 22% 70%, #cbd5e1, transparent),
    radial-gradient(1.5px 1.5px at 40% 12%, #fff, transparent), radial-gradient(1px 1px at 55% 88%, #cbd5e1, transparent),
    radial-gradient(1.5px 1.5px at 33% 45%, #93c5fd, transparent), radial-gradient(1px 1px at 12% 52%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 48% 60%, #fff, transparent), radial-gradient(1px 1px at 62% 30%, #c4b5fd, transparent); }
  .texto { position: absolute; left: 80px; top: 150px; width: 560px; }
  .marca { letter-spacing: .45em; font-weight: 700; color: #93c5fd; font-size: 22px; }
  h1 { font-size: 68px; line-height: 1.05; margin: 22px 0 18px; }
  h1 span { background: linear-gradient(120deg, #fde68a, #fbbf24 40%, #f97316); -webkit-background-clip: text; color: transparent; }
  p { font-size: 26px; color: #cbd5e1; margin: 0; }
  .sistema { position: absolute; right: 60px; top: 45px; width: 540px; height: 540px; }
  .orb { position: absolute; border-radius: 50%; border: 1.5px solid rgba(148,163,255,.25); }
  .sol { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px; border-radius: 50%;
    background: radial-gradient(circle at 40% 38%, #fffbe0, #ffe066 25%, #ffa21a 60%, #ff5e00);
    box-shadow: 0 0 40px #ffb02e, 0 0 110px rgba(255,140,0,.7), 0 0 200px rgba(255,90,0,.45); }
  .p { position: absolute; border-radius: 50%; box-shadow: inset -4px -3px 6px rgba(0,0,0,.5); }
</style></head>
<body>
  <div class="stars"></div>
  <div class="texto">
    <div class="marca">BHADOTT</div>
    <h1>Um universo de <span>tecnologia</span></h1>
    <p>Games · AI · Creative Technology<br>Jogos, apps, sistemas e IA — criado no Brasil.</p>
  </div>
  <div class="sistema">
    <div class="orb" style="inset:150px"></div>
    <div class="orb" style="inset:100px"></div>
    <div class="orb" style="inset:50px"></div>
    <div class="orb" style="inset:0"></div>
    <div class="sol"></div>
    <div class="p" style="width:16px;height:16px;left:255px;top:142px;background:#3ea0ff"></div>
    <div class="p" style="width:14px;height:14px;left:430px;top:300px;background:#e8622c"></div>
    <div class="p" style="width:34px;height:34px;left:70px;top:350px;background:repeating-linear-gradient(0deg,#d8b08a 0 4px,#b07a4f 4px 8px)"></div>
    <div class="p" style="width:26px;height:26px;left:390px;top:30px;background:#e6c27a"></div>
    <div class="p" style="width:18px;height:18px;left:10px;top:200px;background:#4a6cff"></div>
  </div>
</body></html>
